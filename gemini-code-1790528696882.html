<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRコード生成ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <!-- グラフ描画用ライブラリ (Chart.js) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .dark .glass { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 text-slate-100 min-h-screen selection:bg-purple-500 selection:text-white pb-20">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-40 glass border-b border-white/10 px-4 py-3 shadow-lg">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-md shadow-purple-500/30">
                    <i class="fa-solid fa-headphones-simple text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-purple-300 bg-clip-text text-transparent">My Music Hub</h1>
                    <p class="text-xs text-purple-300/80 font-medium">One-Touch Streaming Portal</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="openQRModal()" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold flex items-center space-x-1.5 transition border border-white/10">
                    <i class="fa-solid fa-qrcode text-purple-400"></i>
                    <span class="hidden sm:inline">QRコード</span>
                </button>
                <button id="authBtn" onclick="toggleAuth()" class="px-3 py-2 rounded-xl bg-purple-600/80 hover:bg-purple-600 text-xs font-semibold flex items-center space-x-1.5 transition shadow-md shadow-purple-900/50">
                    <i class="fa-solid fa-lock text-purple-200" id="authIcon"></i>
                    <span id="authText">管理者ログイン</span>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto px-4 mt-6">
        
        <!-- コントロールバー（検索・追加ボタン） -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-6">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderMusicList()" placeholder="曲名やアーティスト名で検索..." class="w-full bg-slate-800/60 border border-slate-700/60 rounded-2xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-purple-500 transition shadow-inner">
            </div>
            
            <button id="addBtn" onclick="openEditModal()" class="hidden px-5 py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white rounded-2xl text-sm font-bold shadow-lg shadow-purple-600/30 flex items-center justify-center space-x-2 transition">
                <i class="fa-solid fa-plus"></i>
                <span>新規追加</span>
            </button>
        </div>

        <!-- 音楽カード一覧 -->
        <div id="musicGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- JavaScriptで動的に生成されます -->
        </div>

        <!-- データが空のときの表示 -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="w-16 h-16 bg-slate-800/80 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-500 text-2xl border border-slate-700">
                <i class="fa-solid fa-music"></i>
            </div>
            <p class="text-slate-400 text-sm font-medium">まだ曲が登録されていません</p>
            <p class="text-slate-500 text-xs mt-1">「管理者ログイン」をして曲を追加してみましょう！</p>
        </div>
    </main>

    <!-- 編集・追加モーダル -->
    <div id="editModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-6 shadow-2xl my-8">
            <div class="flex items-center justify-between mb-5">
                <h3 id="modalTitle" class="text-lg font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-purple-400"></i>
                    <span>曲情報の編集</span>
                </h3>
                <button onclick="closeEditModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="musicForm" onsubmit="saveMusic(event)" class="space-y-4">
                <input type="hidden" id="musicId">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">曲名 <span class="text-pink-500">*</span></label>
                    <input type="text" id="formTitle" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">アーティスト名 <span class="text-pink-500">*</span></label>
                    <input type="text" id="formArtist" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">YouTubeリンク</label>
                        <input type="url" id="formYoutube" placeholder="https://youtu.be/..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">音楽配信リンク (Spotify等)</label>
                        <input type="url" id="formStreaming" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">ジャケット画像</label>
                    <div class="space-y-2">
                        <input type="file" id="imageFileInput" accept="image/*" onchange="handleImageSelect(event)" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-600/20 file:text-purple-300 hover:file:bg-purple-600/30 cursor-pointer">
                        <input type="text" id="formImage" placeholder="または画像URLを直接入力" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 transition">キャンセル</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-xs font-bold text-white shadow-lg shadow-purple-600/30 transition">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 画像トリミング・位置調整モーダル -->
    <div id="cropModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center">
            <h3 class="text-md font-bold text-white mb-3">ジャケット画像の調整</h3>
            <p class="text-xs text-slate-400 mb-4">プレビュー枠内でドラッグして位置を合わせ、ズームを調整してください</p>
            
            <div id="cropContainer" class="relative w-48 h-48 mx-auto bg-slate-950 rounded-2xl overflow-hidden border-2 border-purple-500/50 cursor-grab active:cursor-grabbing mb-4 touch-none select-none">
                <img id="cropImage" class="absolute max-none origin-top-left pointer-events-none" alt="Crop preview">
            </div>

            <div class="mb-5 px-4">
                <label class="block text-xs text-slate-400 mb-1">ズーム倍率</label>
                <input type="range" id="zoomRange" min="1" max="3" step="0.05" value="1" oninput="updateCropTransform()" class="w-full accent-purple-500">
            </div>

            <div class="flex space-x-2">
                <button type="button" onclick="closeCropModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 transition">キャンセル</button>
                <button type="button" onclick="applyCrop()" class="flex-1 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-xs font-bold text-white shadow-lg shadow-purple-600/30 transition">この位置で決定</button>
            </div>
        </div>
    </div>

    <!-- QRコード表示モーダル -->
    <div id="qrModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-md font-bold text-white">サイト共有用 QRコード</h3>
                <button onclick="closeQRModal()" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div id="qrcodeContainer" class="bg-white p-4 rounded-2xl inline-block shadow-inner mb-4"></div>
            
            <p class="text-xs text-slate-400 mb-4 break-all px-2" id="currentUrlText"></p>
            
            <button onclick="copyCurrentUrl()" class="w-full py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-xs font-bold text-white shadow-md shadow-purple-600/30 transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-copy"></i>
                <span>URLをコピーする</span>
            </button>
        </div>
    </div>

    <!-- ログインモーダル -->
    <div id="loginModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-md font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-lock text-purple-400"></i>
                    <span>管理者ログイン</span>
                </h3>
                <button onclick="closeLoginModal()" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p class="text-xs text-slate-400 mb-4">管理者パスワードを入力してください（初期設定: password）</p>
            <form onsubmit="handleLoginSubmit(event)" class="space-y-3">
                <input type="password" id="adminPasswordInput" placeholder="パスワード" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                <button type="submit" class="w-full py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-xs font-bold text-white shadow-lg shadow-purple-600/30 transition">ログイン</button>
            </form>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        let isAdmin = false;
        let musicList = JSON.parse(localStorage.getItem('my_music_list_v2')) || [];
        let chartInstances = {}; // グラフインスタンス保持用

        if (musicList.length === 0) {
            musicList = [
                {
                    id: '1',
                    title: 'VIBE',
                    artist: 'GENERATIONS',
                    youtube: 'https://youtu.be/oc395oRnMuk',
                    streaming: 'https://GENERATIONS.lnk.to/vibe0928',
                    image: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=60'
                }
            ];
            localStorage.setItem('my_music_list_v2', JSON.stringify(musicList));
        }

        function saveToStorage() {
            localStorage.setItem('my_music_list_v2', JSON.stringify(musicList));
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderMusicList();
            checkAuthUI();
        });

        function checkAuthUI() {
            const addBtn = document.getElementById('addBtn');
            const authText = document.getElementById('authText');
            const authIcon = document.getElementById('authIcon');
            const authBtn = document.getElementById('authBtn');

            if (isAdmin) {
                addBtn.classList.remove('hidden');
                authText.textContent = 'ログアウト';
                authIcon.className = 'fa-solid fa-unlock text-emerald-400';
                authBtn.className = 'px-3 py-2 rounded-xl bg-emerald-600/80 hover:bg-emerald-600 text-xs font-semibold flex items-center space-x-1.5 transition shadow-md shadow-emerald-950/50';
            } else {
                addBtn.classList.add('hidden');
                authText.textContent = '管理者ログイン';
                authIcon.className = 'fa-solid fa-lock text-purple-200';
                authBtn.className = 'px-3 py-2 rounded-xl bg-purple-600/80 hover:bg-purple-600 text-xs font-semibold flex items-center space-x-1.5 transition shadow-md shadow-purple-900/50';
            }
            renderMusicList();
        }

        function toggleAuth() {
            if (isAdmin) {
                isAdmin = false;
                alert('ログアウトしました');
                checkAuthUI();
            } else {
                document.getElementById('loginModal').classList.remove('hidden');
            }
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === 'password' || pass === '1234') {
                isAdmin = true;
                closeLoginModal();
                document.getElementById('adminPasswordInput').value = '';
                alert('管理者としてログインしました！');
                checkAuthUI();
            } else {
                alert('パスワードが違います（初期設定は password です）');
            }
        }

        // 再生回数の記録＆即時グラフ更新
        function recordPlay(id) {
            let stats = JSON.parse(localStorage.getItem('my_music_stats')) || {};
            const now = new Date();
            const timeKey = `${now.getHours()}:00`;

            stats[id] = stats[id] || { total: 0, times: {} };
            stats[id].total += 1;
            stats[id].times[timeKey] = (stats[id].times[timeKey] || 0) + 1;

            localStorage.setItem('my_music_stats', JSON.stringify(stats));
            
            // 該当カードのグラフを即時再描画
            renderCardChart(id);
        }

        // 音楽リストの描画
        function renderMusicList() {
            const grid = document.getElementById('musicGrid');
            const emptyState = document.getElementById('emptyState');
            const keyword = document.getElementById('searchInput').value.toLowerCase();

            const filtered = musicList.filter(item => 
                item.title.toLowerCase().includes(keyword) || 
                item.artist.toLowerCase().includes(keyword)
            );

            grid.innerHTML = '';
            chartInstances = {}; // 破棄

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass rounded-3xl p-4 flex flex-col justify-between shadow-lg relative overflow-hidden group hover:border-purple-500/40 transition';
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center space-x-4 mb-3">
                            <img src="${item.image || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop&q=60'}" class="w-20 h-20 rounded-2xl object-cover shadow-md flex-shrink-0" alt="${item.title}">
                            <div class="flex-1 min-w-0">
                                <h4 class="font-bold text-white text-base truncate mb-0.5">${escapeHtml(item.title)}</h4>
                                <p class="text-xs text-purple-300 font-medium truncate mb-3">${escapeHtml(item.artist)}</p>
                                
                                <div class="flex items-center space-x-2">
                                    ${item.youtube ? `<a href="${item.youtube}" target="_blank" onclick="recordPlay('${item.id}')" class="px-3 py-1.5 bg-red-600/90 hover:bg-red-600 text-white rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow-sm transition"><i class="fa-brands fa-youtube"></i><span>YouTube</span></a>` : ''}
                                    ${item.streaming ? `<a href="${item.streaming}" target="_blank" onclick="recordPlay('${item.id}')" class="px-3 py-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow-sm transition"><i class="fa-solid fa-headphones"></i><span>配信で聴く</span></a>` : ''}
                                </div>
                            </div>
                        </div>

                        <!-- カード内ミニグラフ -->
                        <div class="mt-2 pt-2 border-t border-white/10">
                            <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1 font-semibold">
                                <span><i class="fa-solid fa-chart-line text-purple-400 mr-1"></i>再生回数推移</span>
                                <span id="total-count-${item.id}" class="text-purple-300">総合: 0回</span>
                            </div>
                            <div class="bg-slate-950/60 rounded-xl p-2 h-20 relative">
                                <canvas id="chart-${item.id}"></canvas>
                            </div>
                        </div>
                    </div>

                    ${isAdmin ? `
                        <div class="absolute top-3 right-3 flex items-center space-x-1 bg-slate-900/70 backdrop-blur-md p-1 rounded-xl border border-slate-700">
                            <button onclick="openEditModal('${item.id}')" class="w-7 h-7 rounded-lg hover:bg-white/10 text-slate-300 flex items-center justify-center text-xs transition" title="編集"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteMusic('${item.id}')" class="w-7 h-7 rounded-lg hover:bg-red-500/20 text-red-400 flex items-center justify-center text-xs transition" title="削除"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    ` : ''}
                `;
                grid.appendChild(card);
                
                // グラフを描画
                renderCardChart(item.id);
            });
        }

        function renderCardChart(id) {
            const canvasEl = document.getElementById(`chart-${id}`);
            const totalEl = document.getElementById(`total-count-${id}`);
            if (!canvasEl) return;

            const stats = JSON.parse(localStorage.getItem('my_music_stats')) || {};
            const itemStats = stats[id] || { total: 0, times: {} };
            
            if (totalEl) {
                totalEl.textContent = `総合: ${itemStats.total}回`;
            }

            const ctx = canvasEl.getContext('2d');
            
            // 直近の時間帯ラベル
            const labels = ['前々時', '前時', '現在'];
            const nowHour = new Date().getHours();
            const timeKeys = [
                `${nowHour - 2}:00`,
                `${nowHour - 1}:00`,
                `${nowHour}:00`
            ];
            const dataValues = timeKeys.map(k => itemStats.times[k] || 0);

            if (chartInstances[id]) {
                chartInstances[id].destroy();
            }

            chartInstances[id] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '再生回数',
                        data: dataValues,
                        borderColor: 'rgba(168, 85, 247, 1)',
                        backgroundColor: 'rgba(168, 85, 247, 0.15)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true,
                        pointRadius: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#94a3b8', stepSize: 1, font: { size: 9 } },
                            grid: { color: 'rgba(255, 255, 255, 0.03)' }
                        },
                        x: {
                            ticks: { color: '#94a3b8', font: { size: 9 } },
                            grid: { display: false }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // 追加・編集モーダル操作
        function openEditModal(id = null) {
            const modal = document.getElementById('editModal');
            const titleEl = document.getElementById('modalTitle');
            
            document.getElementById('musicForm').reset();
            
            if (id) {
                titleEl.innerHTML = '<i class="fa-solid fa-pen-to-square text-purple-400"></i><span>曲情報の編集</span>';
                const target = musicList.find(m => m.id === id);
                if (target) {
                    document.getElementById('musicId').value = target.id;
                    document.getElementById('formTitle').value = target.title;
                    document.getElementById('formArtist').value = target.artist;
                    document.getElementById('formYoutube').value = target.youtube || '';
                    document.getElementById('formStreaming').value = target.streaming || '';
                    document.getElementById('formImage').value = target.image || '';
                }
            } else {
                titleEl.innerHTML = '<i class="fa-solid fa-plus text-purple-400"></i><span>新規曲の追加</span>';
                document.getElementById('musicId').value = '';
            }
            modal.classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveMusic(e) {
            e.preventDefault();
            const id = document.getElementById('musicId').value;
            const title = document.getElementById('formTitle').value;
            const artist = document.getElementById('formArtist').value;
            const youtube = document.getElementById('formYoutube').value;
            const streaming = document.getElementById('formStreaming').value;
            const image = document.getElementById('formImage').value || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop&q=60';

            if (id) {
                const index = musicList.findIndex(m => m.id === id);
                if (index !== -1) {
                    musicList[index] = { id, title, artist, youtube, streaming, image };
                }
            } else {
                const newId = Date.now().toString();
                musicList.unshift({ id: newId, title, artist, youtube, streaming, image });
            }

            saveToStorage();
            closeEditModal();
            renderMusicList();
            alert('保存しました！');
        }

        function deleteMusic(id) {
            if (confirm('この曲を削除してもよろしいですか？')) {
                musicList = musicList.filter(m => m.id !== id);
                saveToStorage();
                renderMusicList();
            }
        }

        // 画像トリミング関連変数
        let cropState = { imageObj: null, scale: 1, posX: 0, posY: 0, startX: 0, startY: 0, isDragging: false };

        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    cropState.imageObj = img;
                    cropState.scale = 1;
                    cropState.posX = 0;
                    cropState.posY = 0;
                    document.getElementById('zoomRange').value = 1;
                    
                    const cropImgEl = document.getElementById('cropImage');
                    cropImgEl.src = evt.target.result;
                    cropImgEl.style.width = img.width + 'px';
                    cropImgEl.style.height = img.height + 'px';
                    
                    document.getElementById('editModal').classList.add('hidden');
                    document.getElementById('cropModal').classList.remove('hidden');
                    updateCropTransform();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        const container = document.getElementById('cropContainer');
        container.addEventListener('pointerdown', (e) => {
            cropState.isDragging = true;
            cropState.startX = e.clientX - cropState.posX;
            cropState.startY = e.clientY - cropState.posY;
            container.setPointerCapture(e.pointerId);
        });
        container.addEventListener('pointermove', (e) => {
            if (!cropState.isDragging) return;
            cropState.posX = e.clientX - cropState.startX;
            cropState.posY = e.clientY - cropState.startY;
            updateCropTransform();
        });
        container.addEventListener('pointerup', () => { cropState.isDragging = false; });

        function updateCropTransform() {
            const scale = parseFloat(document.getElementById('zoomRange').value);
            cropState.scale = scale;
            const cropImgEl = document.getElementById('cropImage');
            cropImgEl.style.transform = `translate(${cropState.posX}px, ${cropState.posY}px) scale(${scale})`;
        }

        function closeCropModal() {
            document.getElementById('cropModal').classList.add('hidden');
            document.getElementById('editModal').classList.remove('hidden');
        }

        function applyCrop() {
            const canvas = document.createElement('canvas');
            canvas.width = 300;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, 300, 300);
            
            const img = cropState.imageObj;
            const containerSize = 192; // w-48 (192px)
            const ratio = 300 / containerSize;
            
            ctx.save();
            ctx.translate(cropState.posX * ratio, cropState.posY * ratio);
            ctx.scale(cropState.scale, cropState.scale);
            ctx.drawImage(img, 0, 0);
            ctx.restore();

            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            document.getElementById('formImage').value = dataUrl;
            
            document.getElementById('cropModal').classList.add('hidden');
            document.getElementById('editModal').classList.remove('hidden');
        }

        // QRコードモーダル
        function openQRModal() {
            const url = window.location.href;
            document.getElementById('currentUrlText').textContent = url;
            
            const qrContainer = document.getElementById('qrcodeContainer');
            qrContainer.innerHTML = '';
            
            try {
                const qr = qrcode(0, 'M');
                qr.addData(url);
                qr.make();
                qrContainer.innerHTML = qr.createImgTag(5, 4);
            } catch (err) {
                qrContainer.innerHTML = '<p class="text-xs text-red-500">QR生成エラー</p>';
            }
            
            document.getElementById('qrModal').classList.remove('hidden');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        function copyCurrentUrl() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('URLをコピーしました！');
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"]/g, function(tag) {
                const chars = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
                return chars[tag] || tag;
            });
        }
    </script>
